server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same prefix-strip proxy vite's dev server does (frontend/vite.config.js):
    # the SPA always calls "/api/...", nginx forwards it to the backend
    # service with the "/api" prefix removed.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) — fall back to index.html for any
    # path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
