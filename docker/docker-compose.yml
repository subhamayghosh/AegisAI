# Run from the repo root so the build context includes both backend/ and
# frontend/ (see the Dockerfiles' COPY paths):
#
#   docker-compose -f docker/docker-compose.yml --env-file .env up --build
#
# Backend at :8000, frontend at :3000, postgres at :5432.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Must match the DATABASE_URL in .env.example
    # (postgresql+asyncpg://promptshield:promptshield@db:5432/promptshield).
    environment:
      POSTGRES_USER: promptshield
      POSTGRES_PASSWORD: promptshield
      POSTGRES_DB: promptshield
    volumes:
      - promptshield-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptshield -d promptshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Always Postgres inside Docker, regardless of what a local .env
      # points SQLite dev at.
      DATABASE_URL: postgresql+asyncpg://promptshield:promptshield@db:5432/promptshield
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    command: sh -c "alembic upgrade head && uvicorn promptshield.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  promptshield-db-data:
