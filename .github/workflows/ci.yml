name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Write backend .env
        working-directory: backend
        run: |
          cat > .env <<EOF
          APP_ENV=ci
          APP_VERSION=0.1.0
          LOG_LEVEL=INFO
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          DATABASE_URL=sqlite+aiosqlite:///./aegisai.db
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_ALG=HS256
          ACCESS_TOKEN_TTL_MIN=15
          REFRESH_TOKEN_TTL_DAYS=7
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          CLAUDE_WORKING_MODEL=claude-sonnet-5
          CLAUDE_JUDGE_MODEL=claude-opus-4-7
          CLAUDE_TIMEOUT_S=5
          CLAUDE_MAX_RETRIES=2
          TIER2_THRESHOLD=0.75
          SESSION_JAILBREAK_THRESHOLD=0.7
          RATE_LIMIT_LOGIN_PER_MIN=5
          RATE_LIMIT_INSPECT_PER_MIN=60
          SEED_ADMIN_PASSWORD=CiAdminChangeMe123!
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Initialize database schema
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run full suite (backend pytest + regression corpus + frontend vitest)
        run: bash scripts/run_full_suite.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore
